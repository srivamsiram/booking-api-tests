name: API Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button in the Actions tab

permissions:
  contents: write           # needed to push the report to the gh-pages branch

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run regression suite
        id: regression
        run: mvn -B clean test -Pregression
        continue-on-error: true       # still build the report if tests fail; job fails at the end

      - name: Run known-bug suite (expected failures, report only)
        if: always()
        run: mvn -B test -Pknown-bugs -Dmaven.test.failure.ignore=true

      - name: Load previous report history (for trend graphs)
        if: always()
        uses: actions/checkout@v5
        continue-on-error: true       # gh-pages does not exist on the very first run
        with:
          ref: gh-pages
          path: gh-pages

      - name: Add history, categories and environment info
        if: always()
        run: |
          mkdir -p target/allure-results/history
          cp -r gh-pages/history/. target/allure-results/history/ 2>/dev/null || true
          cp allure/categories.json target/allure-results/
          {
            echo "Base.URL=https://restful-booker.herokuapp.com"
            echo "Java=17"
            echo "Branch=${GITHUB_REF_NAME}"
            echo "Commit=${GITHUB_SHA::7}"
          } > target/allure-results/environment.properties

      - name: Generate Allure report
        if: always()
        run: mvn -B allure:report

      - name: Publish report to GitHub Pages
        if: always() && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: target/site/allure-maven-plugin

      - name: Fail the build if regression tests failed
        if: steps.regression.outcome == 'failure'
        run: |
          echo "::error::Regression suite failed - see the Allure report for details"
          exit 1
